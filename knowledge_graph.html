<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Knowledge graph — SkillGraph</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕸️</text></svg>"><link rel="stylesheet" href="../css/style.css"><script src="../js/vendor/d3.min.js" defer></script>
<style>.graph-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;margin-bottom:50px}#graphHost{position:relative;height:min(78vh,820px);min-height:500px;border-radius:22px;overflow:hidden;background:var(--paper);border:1px solid #dfe6e3}#graph{width:100%;height:100%;display:block;touch-action:none}.g-controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:14px}.g-controls label{display:flex;align-items:center;gap:8px;font-size:.92rem;font-weight:500}#nodeInfo{position:sticky;top:calc(var(--nav-h) + 16px)}@media(max-width:960px){.graph-layout{grid-template-columns:1fr}}</style></head>
<body data-page="graph" data-base="../"><div id="nav"></div><main id="main"><div class="wrap">
<div class="page-head"><div><h1 style="font-size:clamp(2rem,4vw,3.2rem)">The knowledge graph</h1><p class="muted">Occupations on the ring, coloured by domain. Skills settle between the occupations that require them.</p></div><span class="small muted" id="gStats"></span></div>
<div class="g-controls"><label>Domain <select class="input" id="domSel" style="width:auto;padding:8px 12px"></select></label>
  <label>Min. edge weight <input type="range" id="gWeight" min="0.2" max="0.8" step="0.05" value="0.4"><output id="gWeightOut">0.40</output></label>
  <label><input type="checkbox" id="gCourses"> Courses</label>
  <input class="input" id="gSearch" placeholder="Find a skill or occupation…" style="max-width:260px;margin-left:auto" aria-label="Find a node"></div>
<div class="graph-layout"><div id="graphHost"><svg id="graph" role="img" aria-label="Force-directed knowledge graph"></svg></div><aside class="panel" id="nodeInfo"></aside></div>
</div></main><script src="../js/app.js" defer></script></body></html>
